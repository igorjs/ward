[package]
name = "ward-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

# The guest agent runs as the entry process inside every microVM. It is a
# deliberately small binary (tokio + prost only) so it stays cheap to bake
# into a rootfs. The vsock transport is Linux-only and gated per-target so
# the crate still builds on dev macOS hosts (lib + unit tests).

[dependencies]
prost = "0.14"
ward-archive = { path = "../ward-archive" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "net",
    "time",
] }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "pty", "termios", "process", "param"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"
rustix = { version = "1", features = ["mount", "fs"] }
libc = "0.2"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
tar = "0.4"
rstest = "0.26"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
