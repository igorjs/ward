[workspace]
resolver = "2"
members = [
  "sdks/rust/ward-client",
    "ward-daemon",
    "ward-cli",
    "ward-core",
    "ward-agent",
    "ward-proto",
    "ward-runtime",
    "ward-mcp",
    "ward-net",
]

# async_trait and tonic codegen box futures, which clippy 1.99 flags as a
# double must_use. The lint has no real signal on generated code.
[workspace.lints.clippy]
double_must_use = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Igor <igor@igorjs.dev>"]
license = "AGPL-3.0-only"
repository = "https://github.com/igorjs/ward"
