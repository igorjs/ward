[package]
name = "ward-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ward's network backends: a no-op stub and an in-process smoltcp TCP/IP stack. See ADR-019, ADR-020."

[dependencies]
# async-trait: makes NetworkBackend object-safe by boxing each async fn's
# future. Mirrors what ward-core does for Backend; same trade-off.
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
# tokio used only via the test rt(macro); kept here so doctests + unit
# tests can share the same runtime spin-up.
tokio = { version = "1", features = ["rt", "macros", "process", "time", "fs", "sync", "net", "io-util"] }
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
    "socket-dhcpv4",
    "socket-icmp",
    "auto-icmp-echo-reply",
    "log",
] }
# heapless is the bounded-Vec type wire::dhcpv4::Repr's dns_servers option
# needs to build a DHCP OFFER; already resolved transitively via smoltcp,
# declared directly here since Rust requires a direct dependency to name
# a crate's path.
heapless = "0.9"
# libc: used in spawn_for_sandbox to call socketpair(2) directly.
# rustix's net feature isn't enabled here; pulling libc for a single
# syscall is cheaper than widening the rustix feature set.
libc = "0.2"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
