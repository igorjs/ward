syntax = "proto3";

package ward.agent.v1;

// ---------------------------------------------------------------------------
// Ward guest-agent wire protocol (internal; not part of the public API).
//
// The agent runs as the entry process inside every microVM and listens on a
// vsock port. The daemon opens one connection per executed process. On that
// connection:
//
//   daemon -> agent : a single Exec, then any number of Stdin / Kill frames
//   agent  -> daemon: Stdout / Stderr line frames, terminated by one Exited
//
// Frames are length-prefixed: a 4-byte big-endian length followed by the
// encoded protobuf message. One connection carries exactly one process.
// ---------------------------------------------------------------------------

// Daemon -> agent.
message Request {
  oneof kind {
    Exec exec = 1;
    Stdin stdin = 2;
    Kill kill = 3;
    Ping ping = 4;
    Resize resize = 5;
    Signal signal = 6;
    PutArchive put_archive = 7;
    GetArchive get_archive = 8;
    ArchiveChunk archive_chunk = 9;
    ArchiveEnd archive_end = 10;
    Top top = 11;
    Stats stats = 12;
    PutSecrets put_secrets = 13;
  }
}

// Start a process. Must be the first frame on a connection.
message Exec {
  repeated string command = 1;          // argv; command[0] is the program
  string working_dir = 2;               // empty = agent default (/)
  map<string, string> env = 3;
  bool tty = 4;                         // run on a pty
  string user = 5;                      // name|uid[:group|gid]; empty = run as the agent
  bool raw = 6;                         // stream raw Data events (implied by tty)
}

// Feed bytes to the process's stdin. Empty data closes stdin (EOF).
message Stdin {
  bytes data = 1;
}

// Request termination of the running process (SIGKILL). Kept for old
// callers; new callers send Signal.
message Kill {}

// Set the pty window size.
message Resize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// Deliver a signal to the running process.
message Signal {
  int32 signo = 1;
}

// Readiness probe. Sent as the first and only frame on a connection; the
// agent answers with one Pong event and closes the connection.
message Ping {}

// Agent -> daemon.
message Event {
  oneof kind {
    Line stdout = 1;
    Line stderr = 2;
    Exited exited = 3;
    Pong pong = 4;
    Data data = 5;
    ArchiveChunk archive_chunk = 6;
    ArchiveDone archive_done = 7;
    ArchiveError archive_error = 8;
    Processes processes = 9;
    TopError top_error = 10;
    StatsSample stats_sample = 11;
  }
}

// File transfer. PutArchive must be the first frame on a connection. The
// daemon then sends ArchiveChunk frames carrying one tar stream and a final
// ArchiveEnd. The agent unpacks the tar into the directory `path` and
// answers with one ArchiveDone or ArchiveError.
message PutArchive {
  string path = 1;                      // absolute guest directory
}

// Must be the first frame on a connection. The agent answers with
// ArchiveChunk frames carrying one tar stream of the file or directory at
// `path`, then ArchiveDone, or ArchiveError if it cannot read the path. The
// walk can fail midway, so chunks received before an ArchiveError are
// incomplete and must be discarded.
message GetArchive {
  string path = 1;                      // absolute guest file or directory
}

// A slice of a tar stream, in either direction.
message ArchiveChunk {
  bytes data = 1;
}

// Daemon -> agent: the tar stream is complete.
message ArchiveEnd {}

// Agent -> daemon: the transfer finished.
message ArchiveDone {}

// Agent -> daemon: the transfer failed; the message says why.
message ArchiveError {
  string message = 1;
}

// Must be the first and only frame on a connection. The agent mounts a tmpfs
// on /run/secrets if none is there yet, writes each file as mode 0400 owned
// by `user` (empty = root), and answers with one ArchiveDone or ArchiveError.
message PutSecrets {
  string user = 1;                      // name|uid[:group|gid]
  repeated SecretFile files = 2;
}

message SecretFile {
  string name = 1;                      // one path component
  bytes content = 2;
}

// Must be the first and only frame on a connection. The agent answers with
// one Processes event built from the guest's /proc, or a TopError when it
// refuses ps_args, then closes.
message Top {
  // ps-style options, empty for `ps -ef`.
  repeated string ps_args = 1;
}

// Agent -> daemon: the ps_args of a Top are not supported.
message TopError {
  string message = 1;
}

// Agent -> daemon: the guest's processes, one row per process, each row with
// one field per title.
message Processes {
  repeated string titles = 1;
  repeated ProcessRow rows = 2;
}

message ProcessRow {
  repeated string fields = 1;
}

// Must be the first and only frame on a connection. The agent answers with
// one StatsSample read from the guest's /proc, then closes.
message Stats {}

// Agent -> daemon: guest-wide counters at one instant.
message StatsSample {
  // Cumulative CPU time all processes have used, in nanoseconds.
  uint64 cpu_nanos = 1;
  uint32 online_cpus = 2;
  uint64 mem_total_bytes = 3;
  // Memory that can be given to a process without swapping.
  uint64 mem_available_bytes = 4;
  uint32 pids = 5;
}

// Answer to Ping.
message Pong {}

// Raw output bytes from one stream, with no line framing.
message Data {
  Stream stream = 1;
  bytes data = 2;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

// One line of output (newline already stripped).
message Line {
  string text = 1;
}

// Terminal event: the process exited. `code` is the exit status, or -1 if
// the process was killed by a signal or produced no code. `wait_status` is
// the raw wait(2) status: exit code in bits 8..15, terminating signal in
// bits 0..6.
message Exited {
  int32 code = 1;
  int32 wait_status = 2;
  // Processes the guest kernel OOM killer ended while this one ran. 0 when
  // none, or when the guest cannot count them.
  uint64 oom_kills = 3;
}
