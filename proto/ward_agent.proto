syntax = "proto3";

package ward.agent.v1;

// ---------------------------------------------------------------------------
// Ward guest-agent wire protocol (internal; not part of the public API).
//
// The agent runs as the entry process inside every microVM and listens on a
// vsock port. The daemon opens one connection per executed process. On that
// connection:
//
//   daemon -> agent : a single Exec, then any number of Stdin / Kill frames
//   agent  -> daemon: Stdout / Stderr line frames, terminated by one Exited
//
// Frames are length-prefixed: a 4-byte big-endian length followed by the
// encoded protobuf message. One connection carries exactly one process.
// ---------------------------------------------------------------------------

// Daemon -> agent.
message Request {
  oneof kind {
    Exec exec = 1;
    Stdin stdin = 2;
    Kill kill = 3;
    Ping ping = 4;
    Resize resize = 5;
    Signal signal = 6;
  }
}

// Start a process. Must be the first frame on a connection.
message Exec {
  repeated string command = 1;          // argv; command[0] is the program
  string working_dir = 2;               // empty = agent default (/)
  map<string, string> env = 3;
  bool tty = 4;                         // run on a pty
  string user = 5;                      // unused until user switching lands
}

// Feed bytes to the process's stdin. Empty data closes stdin (EOF).
message Stdin {
  bytes data = 1;
}

// Request termination of the running process (SIGKILL). Kept for old
// callers; new callers send Signal.
message Kill {}

// Set the pty window size.
message Resize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// Deliver a signal to the running process.
message Signal {
  int32 signo = 1;
}

// Readiness probe. Sent as the first and only frame on a connection; the
// agent answers with one Pong event and closes the connection.
message Ping {}

// Agent -> daemon.
message Event {
  oneof kind {
    Line stdout = 1;
    Line stderr = 2;
    Exited exited = 3;
    Pong pong = 4;
    Data data = 5;
  }
}

// Answer to Ping.
message Pong {}

// Raw output bytes from one stream, with no line framing.
message Data {
  Stream stream = 1;
  bytes data = 2;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

// One line of output (newline already stripped).
message Line {
  string text = 1;
}

// Terminal event: the process exited. `code` is the exit status, or -1 if
// the process was killed by a signal or produced no code. `wait_status` is
// the raw wait(2) status: exit code in bits 8..15, terminating signal in
// bits 0..6.
message Exited {
  int32 code = 1;
  int32 wait_status = 2;
}
