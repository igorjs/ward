syntax = "proto3";

package ward.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Ward service
// ---------------------------------------------------------------------------

service Ward {
  // Sandbox lifecycle
  rpc CreateSandbox(CreateSandboxRequest) returns (SandboxInfo);
  rpc GetSandbox(GetSandboxRequest) returns (SandboxInfo);
  rpc ListSandboxes(google.protobuf.Empty) returns (ListSandboxesResponse);
  rpc RemoveSandbox(RemoveSandboxRequest) returns (google.protobuf.Empty);
  rpc Stop(StopRequest) returns (SandboxInfo);
  rpc Start(StartRequest) returns (SandboxInfo);
  rpc Restart(RestartRequest) returns (SandboxInfo);
  // Give a sandbox a new name, like `docker rename`. The token travels in call
  // metadata. A name held by another sandbox is refused.
  rpc RenameSandbox(RenameSandboxRequest) returns (SandboxInfo);

  // Execution
  rpc Exec(ExecRequest) returns (ProcessInfo);
  rpc Run(RunRequest) returns (ProcessInfo);
  rpc StreamOutput(StreamOutputRequest) returns (stream StreamEvent);
  rpc WriteStdin(WriteStdinRequest) returns (google.protobuf.Empty);
  rpc KillProcess(KillProcessRequest) returns (google.protobuf.Empty);
  // Bidirectional stream to a sandbox process. The first client message
  // must be `start`; the token travels in call metadata.
  rpc Attach(stream AttachMessage) returns (stream AttachMessage);
  // Unpack a tar stream into a directory of a running sandbox. The first
  // client message must be `start`, then `data` chunks of one tar. The token
  // travels in call metadata.
  rpc CopyTo(stream CopyToMessage) returns (google.protobuf.Empty);
  // Stream a tar of a file or directory of a running sandbox. The daemon
  // checks each entry before it forwards any byte from that entry's header
  // on; a refused tar ends the stream with an error.
  rpc CopyFrom(CopyFromRequest) returns (stream CopyFromChunk);
  // List the processes of a running sandbox, like `docker top`. The token
  // travels in call metadata.
  rpc Top(TopRequest) returns (TopResponse);
  // The destinations the sandbox's egress policy refused, most recent first.
  // Kept after the sandbox exits, until it is removed. The token travels in
  // call metadata.
  rpc BlockedEgress(BlockedEgressRequest) returns (BlockedEgressResponse);
  // Add hosts to the egress allowlist of a sandbox created with
  // `--egress allowlist`, effective at once and kept across restarts. The
  // token travels in call metadata. A sandbox created with egress deny is
  // refused, and one with open egress has nothing to add.
  rpc AddEgressAllow(AddEgressAllowRequest) returns (AddEgressAllowResponse);
  // One reading of a running sandbox's resource use, like one frame of
  // `docker stats`. The token travels in call metadata.
  rpc Stats(StatsRequest) returns (StatsResponse);
  // Block until the sandbox's main process ends or the sandbox stops, then
  // return its exit code, like `docker wait`. The token travels in call
  // metadata.
  rpc Wait(WaitRequest) returns (WaitResponse);
  // Paths of a sandbox that differ from its image, like `docker diff`. The
  // token travels in call metadata.
  rpc Diff(DiffRequest) returns (DiffResponse);
  // Lifecycle events of every sandbox, like `docker events`. Replays the
  // recent history from `since`, then streams live until `until`. Like
  // ListSandboxes it needs no sandbox token: it carries only ids, names,
  // images and event kinds. The history holds the last 1024 events, those of
  // destroyed sandboxes included.
  rpc Events(EventsRequest) returns (stream SandboxEvent);

  // Images in the local cache, like `docker images`. Needs no sandbox token,
  // like ListSandboxes.
  rpc ListImages(google.protobuf.Empty) returns (ListImagesResponse);
  // Pull an image into the local cache, streaming progress lines like
  // `docker pull`. Needs no sandbox token. The pull stops at a size cap and
  // fails rather than evict cached images when the cache is full.
  rpc PullImage(PullImageRequest) returns (stream PullProgress);
  // Save a sandbox's filesystem as a new cached image under a local tag,
  // like `docker commit`. The token travels in call metadata. An existing
  // tag is refused and the image cache is never evicted to make room.
  rpc Commit(CommitRequest) returns (CommitResponse);

  // Snapshots
  rpc CreateSnapshot(CreateSnapshotRequest) returns (SnapshotInfo);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (google.protobuf.Empty);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  // Volumes
  rpc CreateVolume(CreateVolumeRequest) returns (VolumeInfo);
  rpc GetVolume(GetVolumeRequest) returns (VolumeInfo);
  rpc ListVolumes(google.protobuf.Empty) returns (ListVolumesResponse);
  rpc RemoveVolume(RemoveVolumeRequest) returns (google.protobuf.Empty);

  // Egress
  rpc GetEgressLog(GetEgressLogRequest) returns (EgressLogResponse);

  // Cross-sandbox communication (pub/sub bus, daemon-mediated)
  rpc Publish(PublishRequest) returns (google.protobuf.Empty);
  rpc Subscribe(SubscribeRequest) returns (stream Message);
  rpc GetCommunicationLog(GetCommunicationLogRequest) returns (CommunicationLogResponse);

  // Health
  rpc GetHealth(google.protobuf.Empty) returns (HealthStatus);
  rpc GetInfo(google.protobuf.Empty) returns (DaemonInfo);

  // Remove a tag or an image from the local cache, like `docker rmi`. Needs
  // no sandbox token. An image a running sandbox uses is never deleted.
  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);
  // Add a tag to a cached image, like `docker tag`. Needs no sandbox token.
  rpc TagImage(TagImageRequest) returns (google.protobuf.Empty);
  // The layers of a cached image, newest first, like `docker history`.
  // Needs no sandbox token.
  rpc ImageHistory(ImageHistoryRequest) returns (ImageHistoryResponse);
  // Write cached images as an OCI image layout archive, like `docker save`.
  // Needs no sandbox token.
  rpc SaveImages(SaveImagesRequest) returns (stream ArchiveChunk);
  // Add the images of an archive to the cache, like `docker load`. Needs no
  // sandbox token. Docker and OCI layout archives are accepted.
  rpc LoadImages(stream ArchiveChunk) returns (LoadImagesResponse);
  // Write a sandbox's filesystem as a tar archive, like `docker export`. The
  // token travels in call metadata. Works in any sandbox state.
  rpc ExportSandbox(ExportSandboxRequest) returns (stream ArchiveChunk);
  // Make a one-layer image from a tar archive, like `docker import`. Needs
  // no sandbox token. The first message carries the settings and no data.
  rpc ImportImage(stream ImportImageMessage) returns (ImportImageResponse);
  // Check that a registry accepts a login, for `ward login`. Needs no sandbox
  // token. The daemon keeps nothing; the CLI stores the credentials.
  rpc CheckRegistryLogin(CheckRegistryLoginRequest) returns (google.protobuf.Empty);
  // Change the memory, CPU, pids limit or restart policy of a running or
  // stopped sandbox, like `docker update`. The token travels in call metadata.
  rpc UpdateSandbox(UpdateSandboxRequest) returns (SandboxInfo);
  // Freeze every process of a running sandbox, like `docker pause`. The
  // microVM keeps running; only the sandbox's processes stop. The token
  // travels in call metadata.
  rpc Pause(PauseRequest) returns (SandboxInfo);
  // Thaw a paused sandbox, like `docker unpause`.
  rpc Unpause(UnpauseRequest) returns (SandboxInfo);
}

// ---------------------------------------------------------------------------
// Sandbox messages
// ---------------------------------------------------------------------------

message CreateSandboxRequest {
  string image = 1;
  repeated Mount mounts = 2;
  repeated string volume_ids = 3;
  EgressPolicy egress = 4;
  ResourceLimits resources = 5;
  map<string, string> env = 6;
  string from_snapshot = 7;  // optional: create from snapshot ID
  CommunicationPolicy comms = 8;  // cross-sandbox pub/sub access
  string name = 9;
  repeated string command = 10;  // main process argv; empty means none
  string workdir = 11;
  bool tty = 12;
  // Remove the sandbox once its main process ends.
  bool auto_remove = 13;
  // Start from the image config like `docker run`: the image Entrypoint and
  // Cmd fill in what `command` leaves out, and its WorkingDir and Env fill in
  // `workdir` and `env`. Without it only the fields given here apply.
  bool use_image_config = 14;
  // Replaces the image Entrypoint. Present but empty clears it. When set, the
  // image Cmd is ignored unless `command` is given. Needs use_image_config.
  optional string entrypoint = 15;
  // Fail when no command results from the request and the image config.
  // Needs use_image_config.
  bool require_command = 16;
  // Run the main process, and by default every exec, as this user:
  // name|uid[:group|gid], like `docker run --user`. Empty uses the image's
  // User.
  string user = 17;
  // Host ports to forward into the guest, like `docker run -p`.
  repeated PortMapping published_ports = 18;
  // When to pull `image`, like `docker run --pull`. Unspecified means
  // missing. Ignored when `from_snapshot` is set.
  PullPolicy pull_policy = 19;
  // Files written to /run/secrets before the main process starts. The daemon
  // keeps them in memory only and never stores or reports them.
  repeated SecretFile secrets = 20;
  // Key/value metadata kept on the sandbox, like `docker run --label`.
  map<string, string> labels = 21;
  // Host name inside the guest, like `docker run --hostname`. Empty means the
  // first 12 characters of the sandbox id.
  string hostname = 22;
  // Signal that stops the main process, like `docker run --stop-signal`:
  // a name (SIGINT, INT) or a number. Empty means SIGTERM.
  string stop_signal = 23;
  // Seconds the main process gets after the stop signal before SIGKILL, like
  // `docker run --stop-timeout`. Absent uses the daemon default, 0 kills at
  // once and -1 waits forever.
  optional int32 stop_timeout = 24;
  // What to do when the main process ends, like `docker run --restart`.
  // Absent means "no".
  RestartPolicy restart_policy = 25;
  // Guest setup options, like Docker's HostConfig.
  GuestOptions guest = 26;
}

// Guest setup options of `docker run`. Every field is optional; new ones are
// appended as the options they stand for are added.
message GuestOptions {
  // Mount the root filesystem read-only, like `docker run --read-only`.
  bool read_only_rootfs = 1;
  // Tmpfs mounts, like `docker run --tmpfs PATH[:OPTIONS]`.
  repeated TmpfsMount tmpfs = 2;
  // Size of /dev/shm in bytes, like `docker run --shm-size`. 0 means 64 MiB.
  uint64 shm_size_bytes = 3;
  // Lines added to /etc/hosts, "HOST:IP", like `docker run --add-host`.
  repeated string extra_hosts = 4;
  // Search domains for resolv.conf, like `docker run --dns-search`.
  repeated string dns_search = 5;
  // Resolver options for resolv.conf, like `docker run --dns-option`.
  repeated string dns_options = 6;
  // Resource limits set on every process, like `docker run --ulimit`.
  repeated Ulimit ulimits = 7;
  // Supplementary groups, names or ids, like `docker run --group-add`.
  repeated string group_add = 8;
  // Limits the guest's cgroup enforces.
  CgroupLimits cgroup = 9;
  // The health check the daemon runs in the guest, like `docker run --health-cmd`.
  Healthcheck healthcheck = 10;
}

// Mirrors Docker's Config.Healthcheck. A zero duration or count uses the
// default (30s interval, 30s timeout, 0s start period, 3 retries).
message Healthcheck {
  // ["CMD-SHELL", command], ["CMD", program, args...] or ["NONE"].
  repeated string test = 1;
  uint64 interval_ns = 2;
  uint64 timeout_ns = 3;
  uint64 start_period_ns = 4;
  uint32 retries = 5;
}

// Mirrors Docker's State.Health.
message HealthState {
  // "starting", "healthy" or "unhealthy".
  string status = 1;
  uint32 failing_streak = 2;
  // The last five checks, oldest first.
  repeated HealthLogEntry log = 3;
}

message HealthLogEntry {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  int32 exit_code = 3;
  string output = 4;
}

// One `--ulimit NAME=SOFT:HARD`. -1 means unlimited.
message Ulimit {
  string name = 1;
  int64 soft = 2;
  int64 hard = 3;
}

// Docker's cgroup options. 0 means not set, except `cpu_quota`, where 0 and
// -1 both mean unlimited.
message CgroupLimits {
  // `--memory-swap`. The guest has no swap, so only the memory limit is valid.
  int64 memory_swap_bytes = 1;
  // `--memory-reservation`, enforced as memory.low.
  uint64 memory_reservation_bytes = 2;
  // `--cpu-shares`, enforced as cpu.weight.
  uint32 cpu_shares = 3;
  // `--cpuset-cpus`, such as "0-1,3".
  string cpuset_cpus = 4;
  // `--cpu-period` in microseconds.
  uint64 cpu_period = 5;
  // `--cpu-quota` in microseconds per period.
  int64 cpu_quota = 6;
}

// A tmpfs mounted at `path`.
message TmpfsMount {
  string path = 1;
  // Comma separated mount options as `docker run --tmpfs` takes them, such as
  // "size=64m,noexec". Empty means the defaults.
  string options = 2;
}

// Mirrors Docker's restart policy.
message RestartPolicy {
  // "no", "on-failure", "always" or "unless-stopped". Empty means "no".
  string name = 1;
  // Restarts "on-failure" may make. 0 means no limit; other names need 0.
  uint32 maximum_retry_count = 2;
}

// A secret delivered to the guest as the read-only file /run/secrets/<name>
// (mode 0400, owned by the process user). Its content is never logged,
// stored, or shown by inspect, ps or events.
message SecretFile {
  string name = 1;
  bytes content = 2;
}

// Mirrors Docker's `--pull` values, plus `pinned`.
enum PullPolicy {
  PULL_POLICY_UNSPECIFIED = 0;
  // Pull even when the image is cached, so a moved tag is picked up.
  PULL_POLICY_ALWAYS = 1;
  // Pull only when the image is not cached.
  PULL_POLICY_MISSING = 2;
  // Fail when the image is not cached.
  PULL_POLICY_NEVER = 3;
  // Like missing, but refuse a reference that has no sha256 digest.
  PULL_POLICY_PINNED = 4;
}

// A host TCP port forwarded to a guest port. In a create request `host_port`
// 0 asks for any free port and `host_ip` empty means 127.0.0.1; in
// SandboxInfo both are filled with the values in use.
message PortMapping {
  string host_ip = 1;
  uint32 host_port = 2;
  uint32 container_port = 3;
  // "tcp" or empty. Other protocols are rejected.
  string protocol = 4;
}

message GetSandboxRequest {
  string id = 1;
}

message RemoveSandboxRequest {
  string id = 1;
}

// `id` is a sandbox name, id or unique id prefix.
message RenameSandboxRequest {
  string id = 1;
  string new_name = 2;
}

// `id` is a sandbox name, id or unique id prefix.
message StopRequest {
  string id = 1;
  // Seconds to wait after SIGTERM before SIGKILL. Absent means 10, 0 kills
  // at once, a negative value waits without limit.
  optional int32 grace_seconds = 2;
  // Signal that asks the main process to end, by name or number, instead of
  // the sandbox's stop signal. Absent or empty keeps the sandbox's own.
  optional string signal = 3;
}

message StartRequest {
  string id = 1;
}

message RestartRequest {
  string id = 1;
  // Same meaning as StopRequest.grace_seconds.
  optional int32 grace_seconds = 2;
  // Same meaning as StopRequest.signal.
  optional string signal = 3;
}

message ListSandboxesResponse {
  repeated SandboxInfo sandboxes = 1;
}

message SandboxInfo {
  string id = 1;
  SandboxStatus status = 2;
  string image = 3;
  google.protobuf.Timestamp created_at = 4;
  string ip_address = 5;
  ResourceLimits resources = 6;
  google.protobuf.Timestamp expires_at = 7;
  // Populated only on CreateSandbox's response; empty on GetSandbox/ListSandboxes.
  string token = 8;
  string name = 9;
  // Absent until the main process has exited, so exit 0 differs from never exited.
  optional int32 exit_code = 10;
  string workdir = 11;
  // argv[0] of the main command. Always safe to show.
  string command_name = 12;
  // Full argv, which can hold secrets. Filled only for a caller with a valid token.
  repeated string command = 13;
  // Absent until the main process has started or ended.
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp finished_at = 15;
  // Leading part of `command` that came from an Entrypoint. Filled like
  // `command`.
  repeated string entrypoint = 16;
  // The user the main process runs as: the request's `user`, else the
  // image's User. Empty means the guest default (root).
  string user = 17;
  repeated PortMapping published_ports = 18;
  // Why the sandbox last ended. Unspecified while it runs or when unknown.
  EndReason end_reason = 19;
  // Manifest digest the image resolved to when the sandbox was created,
  // e.g. sha256:... Empty for a sandbox created before it was recorded.
  string image_digest = 20;
  map<string, string> labels = 21;
  // The host name the guest has: the request's, else the short sandbox id.
  string hostname = 22;
  string stop_signal = 23;
  optional int32 stop_timeout = 24;
  RestartPolicy restart_policy = 25;
  // Times the daemon restarted the sandbox since it was last started by hand.
  uint32 restart_count = 26;
  // Whether the main process runs on a pseudo-terminal.
  bool tty = 30;
  // True while the sandbox's processes are frozen by Pause. Its status stays
  // running, as Docker's State.Running does.
  bool paused = 27;
  GuestOptions guest = 28;
  // Host directories shared into the guest, from `-v` and `--mount`.
  repeated Mount mounts = 29;
  // Absent unless the sandbox has a health check.
  HealthState health = 40;
}

enum EndReason {
  END_REASON_UNSPECIFIED = 0;
  END_REASON_EXITED = 1;
  END_REASON_SIGNAL = 2;
  END_REASON_OOM = 3;
  END_REASON_TIMEOUT = 4;
  END_REASON_EGRESS_POLICY = 5;
}

enum SandboxStatus {
  SANDBOX_STATUS_UNSPECIFIED = 0;
  SANDBOX_STATUS_CREATING = 1;
  SANDBOX_STATUS_RUNNING = 2;
  SANDBOX_STATUS_STOPPED = 3;
  SANDBOX_STATUS_FAILED = 4;
  SANDBOX_STATUS_EXITED = 5;
  SANDBOX_STATUS_STOPPING = 6;
}

message Mount {
  string source = 1;
  string target = 2;
  bool readonly = 3;
}

message EgressPolicy {
  EgressMode mode = 1;
  repeated string domains = 2;
}

enum EgressMode {
  EGRESS_MODE_UNSPECIFIED = 0;
  EGRESS_MODE_DENY = 1;
  EGRESS_MODE_ALLOWLIST = 2;
  EGRESS_MODE_OPEN = 3;
}

message ResourceLimits {
  uint32 cpus = 1;
  uint32 memory_mb = 2;
  uint32 pids_max = 3;
  uint64 timeout_seconds = 4;
  // Remove the sandbox this long after it ends. 0 uses the daemon default,
  // which is off unless the operator sets one.
  uint64 exited_ttl_seconds = 5;
  // CPU limit in billionths of a CPU, set by UpdateSandbox. 0 means the whole
  // `cpus`. Enforced as a CFS quota inside the VM.
  uint64 nano_cpus = 6;
}

// ---------------------------------------------------------------------------
// Execution messages
// ---------------------------------------------------------------------------

message ExecRequest {
  string sandbox_id = 1;
  repeated string command = 2;
  string working_dir = 3;
  map<string, string> env = 4;
  // name|uid[:group|gid]. Empty uses the sandbox's user.
  string user = 5;
  // Files written to /run/secrets before the command starts.
  repeated SecretFile secrets = 6;
}

message RunRequest {
  string sandbox_id = 1;
  string language = 2;
  string code = 3;
}

message ProcessInfo {
  string pid = 1;
  string sandbox_id = 2;
  string status = 3;
}

message StreamOutputRequest {
  string sandbox_id = 1;
  string pid = 2;
}

message StreamEvent {
  StreamEventType type = 1;
  string line = 2;
  int32 exit_code = 3;
  google.protobuf.Timestamp timestamp = 4;
  uint64 duration_ms = 5;
}

enum StreamEventType {
  STREAM_EVENT_TYPE_UNSPECIFIED = 0;
  STREAM_EVENT_TYPE_STDOUT = 1;
  STREAM_EVENT_TYPE_STDERR = 2;
  STREAM_EVENT_TYPE_EXIT = 3;
}

message WriteStdinRequest {
  string sandbox_id = 1;
  string pid = 2;
  bytes data = 3;
}

message KillProcessRequest {
  string sandbox_id = 1;
  // "0" means the sandbox's main process.
  string pid = 2;
  // Signal number sent to the main process. 0 means SIGKILL.
  int32 signal = 3;
}

// One message type for both directions of an Attach stream.
// Client sends: start, stdin, resize, signal. Server sends: data, exit.
message AttachMessage {
  oneof kind {
    AttachStart start = 1;
    AttachStdin stdin = 2;
    AttachResize resize = 3;
    AttachSignal signal = 4;
    AttachData data = 5;
    AttachExit exit = 6;
    AttachReplayEnd replay_end = 7;
  }
}

enum AttachMode {
  ATTACH_MODE_UNSPECIFIED = 0;
  ATTACH_MODE_MAIN_PROCESS = 1;  // attach to the running main process
  ATTACH_MODE_EXEC = 2;          // start `command` in the sandbox
}

message AttachStart {
  string sandbox_id = 1;
  AttachMode mode = 2;
  repeated string command = 3;  // exec mode only
  bool tty = 4;
  map<string, string> env = 5;
  string workdir = 6;
  string user = 7;
  bool replay = 8;  // read-only: replay buffered output, ignore stdin
  bool follow = 9;  // keep streaming live output after the replay
  // Exec mode only: files written to /run/secrets before the command starts.
  repeated SecretFile secrets = 10;
}

message AttachStdin {
  // An empty `data` is end of input (EOF) and closes the process stdin.
  bytes data = 1;
}

message AttachResize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message AttachSignal {
  int32 signo = 1;
}

message AttachData {
  bytes data = 1;
  // Which stream the bytes came from. Absent or 0 means stdout, so a client
  // or server that predates this field keeps its behavior.
  AttachStream stream = 2;
  // When the daemon received the bytes. Absent when the server predates it.
  google.protobuf.Timestamp timestamp = 3;
}

// Sent once on a main process attach, after the buffered output and before
// any live output, so a client knows where the replay ends.
message AttachReplayEnd {}

enum AttachStream {
  ATTACH_STREAM_STDOUT = 0;
  ATTACH_STREAM_STDERR = 1;
}

message AttachExit {
  int32 exit_code = 1;
}

// ---------------------------------------------------------------------------
// File copy messages
// ---------------------------------------------------------------------------

message CopyToMessage {
  oneof kind {
    CopyToStart start = 1;
    // A slice of the tar stream; at most 1 MiB.
    bytes data = 2;
  }
}

message CopyToStart {
  string sandbox_id = 1;
  // Absolute guest directory the tar is unpacked into.
  string path = 2;
}

message CopyFromRequest {
  string sandbox_id = 1;
  // Absolute guest file or directory.
  string path = 2;
}

message CopyFromChunk {
  bytes data = 1;
}

// ---------------------------------------------------------------------------
// Top messages
// ---------------------------------------------------------------------------

message TopRequest {
  string sandbox_id = 1;
  // ps-style options as `docker top` takes them: none (`-ef`), aux, axu, -e,
  // -A, -f, -ef, -Af, -o/-eo LIST (pid, ppid, uid, user, comm, args, cmd,
  // time, stime, tty, stat, vsz, rss, pcpu, pmem, c), -u USER, -p PID. Times
  // are UTC. Any other option is refused with INVALID_ARGUMENT.
  repeated string ps_args = 2;
}

message TopResponse {
  repeated string titles = 1;
  repeated TopProcess processes = 2;
}

// One process, with one field per title.
message TopProcess {
  repeated string fields = 1;
}

// ---------------------------------------------------------------------------
// Blocked egress messages
// ---------------------------------------------------------------------------

message BlockedEgressRequest {
  string sandbox_id = 1;
}

message BlockedEgressResponse {
  repeated BlockedDestination destinations = 1;
}

message AddEgressAllowRequest {
  string sandbox_id = 1;
  // DNS names, each optionally with a leading `*.`.
  repeated string domains = 2;
}

message AddEgressAllowResponse {
  // The names this call added; ones already allowed are left out.
  repeated string added = 1;
}

// A refused destination: a DNS name, or an IP address when no name is known.
message BlockedDestination {
  string host = 1;
  // How many times the policy refused it.
  uint64 count = 2;
  // Unix time of the latest refusal, in seconds.
  uint64 last_seen_unix = 3;
}

// ---------------------------------------------------------------------------
// Stats and wait messages
// ---------------------------------------------------------------------------

message StatsRequest {
  string sandbox_id = 1;
}

message StatsResponse {
  // CPU time all guest processes have used so far, in nanoseconds.
  uint64 cpu_nanos = 1;
  uint32 online_cpus = 2;
  // Guest memory in use, not counting memory that can be reclaimed.
  uint64 mem_used_bytes = 3;
  // The configured memory limit, or the guest's total memory without one.
  uint64 mem_limit_bytes = 4;
  uint32 pids = 5;
  // When the daemon took the reading, for working out rates between two.
  google.protobuf.Timestamp read_at = 6;
  // Highest memory the sandbox has used, in bytes. 0 when unknown.
  uint64 mem_peak_bytes = 7;
  // Bytes read from and written to block devices.
  uint64 block_read_bytes = 8;
  uint64 block_write_bytes = 9;
  // Ethernet bytes the guest received and sent through the host network
  // stack since the sandbox last started.
  uint64 net_rx_bytes = 10;
  uint64 net_tx_bytes = 11;
}

message WaitRequest {
  string sandbox_id = 1;
  // When to stop waiting. Absent means not running, as before.
  WaitCondition condition = 2;
}

// Docker's `wait --condition` values.
enum WaitCondition {
  // The sandbox is not running, or stops running.
  WAIT_CONDITION_NOT_RUNNING = 0;
  // The sandbox's main process exits next, in this run or the next one.
  WAIT_CONDITION_NEXT_EXIT = 1;
  // The sandbox is removed.
  WAIT_CONDITION_REMOVED = 2;
}

message WaitResponse {
  // The main process's exit code, or 0 for a sandbox without a command.
  int32 exit_code = 1;
}

// ---------------------------------------------------------------------------
// Diff messages
// ---------------------------------------------------------------------------

message DiffRequest {
  string sandbox_id = 1;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_MODIFIED = 1;
  CHANGE_KIND_ADDED = 2;
  CHANGE_KIND_DELETED = 3;
}

message FileChange {
  ChangeKind kind = 1;
  // Absolute path inside the sandbox, as raw bytes: a guest file name need
  // not be valid UTF-8.
  bytes path = 2;
}

message DiffResponse {
  // Sorted by path. A changed path's parent directories are listed as
  // modified, as `docker diff` does.
  repeated FileChange changes = 1;
}

// ---------------------------------------------------------------------------
// Image messages
// ---------------------------------------------------------------------------

message ImageInfo {
  // The reference the image was pulled as, e.g. alpine:3.20.
  string reference = 1;
  // Manifest digest, e.g. sha256:...
  string digest = 2;
  uint64 size_bytes = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListImagesResponse {
  repeated ImageInfo images = 1;
}

message PullImageRequest {
  string reference = 1;
}

message PullProgress {
  // The layer or tag the line is about. Empty for a line about the image.
  string id = 1;
  // Docker's wording, e.g. "Pull complete".
  string status = 2;
}

message CommitRequest {
  string sandbox_id = 1;
  // Local tag for the new image, e.g. myapp:v2. Empty leaves it untagged.
  string reference = 2;
  string author = 3;
  string message = 4;
  // Dockerfile instructions applied to the image config: CMD, ENTRYPOINT,
  // ENV, WORKDIR and USER.
  repeated string changes = 5;
  // Accepted for Docker compatibility. A sandbox cannot be paused yet, so
  // the copy is always taken live.
  bool pause = 6;
}

message CommitResponse {
  // Id of the new image, e.g. sha256:...
  string image_id = 1;
}

// ---------------------------------------------------------------------------
// Event messages
// ---------------------------------------------------------------------------

message EventsRequest {
  // Replay events from this time. Unset replays none. Only a bounded recent
  // history is kept in memory, so older events are not available.
  google.protobuf.Timestamp since = 1;
  // End the stream at this time. Unset streams until the client hangs up.
  google.protobuf.Timestamp until = 2;
}

message SandboxEvent {
  // create, start, die, stop or destroy.
  string action = 1;
  string sandbox_id = 2;
  google.protobuf.Timestamp at = 3;
  // image, name and, for die, exitCode and reason (an EndReason name).
  map<string, string> attributes = 4;
  // Events this reader missed just before this one because it read too
  // slowly. Zero when none.
  uint64 dropped = 5;
}

// ---------------------------------------------------------------------------
// Snapshot messages
// ---------------------------------------------------------------------------

message CreateSnapshotRequest {
  string sandbox_id = 1;
  string label = 2;
}

message RestoreSnapshotRequest {
  string sandbox_id = 1;
  string snapshot_id = 2;
}

message ListSnapshotsRequest {
  string sandbox_id = 1;
}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
}

message SnapshotInfo {
  string snapshot_id = 1;
  string sandbox_id = 2;
  string label = 3;
  google.protobuf.Timestamp created_at = 4;
  uint64 size_bytes = 5;
}

// ---------------------------------------------------------------------------
// Volume messages
// ---------------------------------------------------------------------------

message CreateVolumeRequest {
  string name = 1;
  uint32 size_mb = 2;
}

message GetVolumeRequest {
  string id = 1;
}

message RemoveVolumeRequest {
  string id = 1;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
}

message VolumeInfo {
  string id = 1;
  string name = 2;
  uint32 size_mb = 3;
  google.protobuf.Timestamp created_at = 4;
  string mount_path = 5;
}

// ---------------------------------------------------------------------------
// Egress messages
// ---------------------------------------------------------------------------

message GetEgressLogRequest {
  string sandbox_id = 1;
}

message EgressLogResponse {
  repeated EgressLogEntry entries = 1;
}

message EgressLogEntry {
  string sandbox_id = 1;
  string domain = 2;
  string port = 3;
  bool allowed = 4;
  google.protobuf.Timestamp timestamp = 5;
}

// ---------------------------------------------------------------------------
// Health messages
// ---------------------------------------------------------------------------

message HealthStatus {
  string status = 1;
  uint64 uptime_seconds = 2;
  uint32 sandbox_count = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message DaemonInfo {
  string version = 1;
  string platform = 2;
  string backend = 3;
  string arch = 4;
}

// ---------------------------------------------------------------------------
// Cross-sandbox communication messages
//
// Sandboxes communicate via a daemon-mediated pub/sub bus. The daemon is the
// broker for every message: this preserves the isolation boundary, allows
// auditing (every publish is logged), and lets policy be enforced at the
// hub rather than trusting each sandbox runtime.
// ---------------------------------------------------------------------------

// Communication policy declared at sandbox creation. Default mode is DENY:
// the sandbox cannot publish or subscribe to any topic. GROUP mode opts the
// sandbox into a named group; sandboxes sharing the same group name can
// exchange messages.
message CommunicationPolicy {
  CommunicationMode mode = 1;
  // Required when mode is GROUP. Treated as opaque identifier; sandboxes
  // with identical group strings see each other's messages.
  string group = 2;
}

enum CommunicationMode {
  COMMUNICATION_MODE_UNSPECIFIED = 0;
  COMMUNICATION_MODE_DENY = 1;
  COMMUNICATION_MODE_GROUP = 2;
}

message PublishRequest {
  string sandbox_id = 1;
  string topic = 2;
  bytes payload = 3;
}

message SubscribeRequest {
  string sandbox_id = 1;
  string topic = 2;
}

message Message {
  string topic = 1;
  string from_sandbox = 2;
  bytes payload = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message GetCommunicationLogRequest {
  string sandbox_id = 1;
}

message CommunicationLogResponse {
  repeated CommunicationLogEntry entries = 1;
}

message CommunicationLogEntry {
  string from_sandbox = 1;
  string topic = 2;
  bool allowed = 3;
  uint32 subscriber_count = 4;
  google.protobuf.Timestamp timestamp = 5;
}

// ---------------------------------------------------------------------------
// Image management messages
// ---------------------------------------------------------------------------

message RemoveImageRequest {
  // A tag, an image id or a unique prefix of one.
  string reference = 1;
  // Delete an image that stopped sandboxes use, or that has several tags.
  bool force = 2;
}

message RemoveImageResponse {
  // References that no longer name the image, in `docker rmi` order.
  repeated string untagged = 1;
  // Ids of the images deleted from the cache.
  repeated string deleted = 2;
}

message TagImageRequest {
  // A tag, an image id or a unique prefix of one.
  string source = 1;
  // The new tag. It moves off any other image that holds it.
  string target = 2;
}

message ImageHistoryRequest {
  string reference = 1;
}

message HistoryLayer {
  // Unset when the image config gave no time.
  google.protobuf.Timestamp created = 1;
  string created_by = 2;
  // Zero for a step that adds no layer.
  uint64 size_bytes = 3;
  string comment = 4;
}

message ImageHistoryResponse {
  // Id of the image, e.g. sha256:...
  string image_id = 1;
  // Newest first.
  repeated HistoryLayer layers = 2;
}

message SaveImagesRequest {
  // Tags, image ids or unique id prefixes.
  repeated string references = 1;
}

message ArchiveChunk {
  bytes data = 1;
}

message LoadedImage {
  // Id of the image, e.g. sha256:...
  string image_id = 1;
  // Names the archive gave the image. Empty when it gave none.
  repeated string references = 2;
}

message LoadImagesResponse {
  repeated LoadedImage images = 1;
}

message ExportSandboxRequest {
  string sandbox_id = 1;
}

message ImportImageMessage {
  // Settings; read from the first message only.
  // Local tag for the new image. Empty leaves it untagged.
  string reference = 1;
  string message = 2;
  // Dockerfile instructions applied to the image config: CMD, ENTRYPOINT,
  // ENV, WORKDIR and USER.
  repeated string changes = 3;
  // A piece of the tar archive, plain or gzip.
  bytes data = 4;
}

message ImportImageResponse {
  // Id of the new image, e.g. sha256:...
  string image_id = 1;
}

message CheckRegistryLoginRequest {
  // Registry host, e.g. ghcr.io or localhost:5000.
  string server = 1;
  string username = 2;
  string password = 3;
}

// `id` is a sandbox name, id or unique id prefix. A field left unset keeps
// its value.
message UpdateSandboxRequest {
  string id = 1;
  // New memory limit in MiB. 0 removes the limit. On a running sandbox it
  // cannot exceed the VM's memory, which is fixed until the next start.
  optional uint32 memory_mb = 2;
  // New CPU limit in billionths of a CPU. 0 removes the limit. On a running
  // sandbox it cannot exceed the VM's CPU count.
  optional uint64 nano_cpus = 3;
  // New limit on processes. 0 removes the limit.
  optional uint32 pids_max = 4;
  optional RestartPolicy restart_policy = 5;
}

// `id` is a sandbox name, id or unique id prefix.
message PauseRequest {
  string id = 1;
}

// `id` is a sandbox name, id or unique id prefix.
message UnpauseRequest {
  string id = 1;
}
