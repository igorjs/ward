# Build per-target ward release artefacts on a version tag push and
# publish them to a GitHub Release. Consumed by:
#
#   - install.sh (curl -fsSL https://raw.githubusercontent.com/igorjs/ward/main/install.sh | bash)
#   - homebrew-ward tap (formula points at the macOS arm64 tarball)
#   - Linux .deb packaging (future job, gated on GPG secret being set)
#
# Goal: a fresh user runs install.sh, gets a working `ward` + `wardd`
# binary, and never installs anything else. Every release is built with
# the real microVM backend. libkrun, libkrunfw and the guest agent are
# embedded in the binaries at build time by the ward-bundle crate.
#
# Gating: tag push only. `v*` semver tags trigger the full matrix.
# Manual workflow_dispatch also supported for testing without cutting
# a tag (uploads under a `dev-<sha>` release).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Resolve version + decide build features once ───────────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry, apt + brew (for protoc). The sigstore
          # endpoints (fulcio / rekor / tuf-repo-cdn) used to live
          # here for actions/attest-build-provenance; the SLSA L3
          # generator does its own sigstore signing inside its
          # isolated reusable-workflow context, so they're no longer
          # needed in any caller-side job.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: r
        # Workflow-controlled inputs routed through env: per the GHA
        # expression-injection guidance, even though they aren't
        # user-tainted. Keeps the shell free of `${{ }}` foot-guns.
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF##refs/tags/}"
            VERSION="${TAG#v}"
          else
            # workflow_dispatch — synthesise a dev tag. VERSION must
            # match TAG (no semver-style "0.0.0-<sha>" rewrite) because
            # the tarball filename `ward-${VERSION}-${TARGET}.tar.gz`
            # is what install.sh resolves from WARD_VERSION. A
            # mismatch makes the smoke-test install.sh path 404 on
            # download — that's exactly what blocked #4 first time.
            SHORT_SHA="$(echo ${SHA} | cut -c1-7)"
            TAG="dev-${SHORT_SHA}"
            VERSION="${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${TAG} version=${VERSION}"

  # ── Build per target ───────────────────────────────────────────────
  build:
    needs: [resolve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            guest_target: aarch64-unknown-linux-musl
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            guest_target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            guest_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry, apt + brew (for protoc). The sigstore
          # endpoints (fulcio / rekor / tuf-repo-cdn) used to live
          # here for actions/attest-build-provenance; the SLSA L3
          # generator does its own sigstore signing inside its
          # isolated reusable-workflow context, so they're no longer
          # needed in any caller-side job.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            # libprotobuf-dev brings the well-known proto files
            # (google/protobuf/empty.proto, timestamp.proto, etc.) that
            # protobuf-compiler alone does not install on Ubuntu 24.04
            # under --no-install-recommends. Without them, prost-build
            # fails with "File not found" on the google.protobuf imports
            # in ward.proto.
            sudo apt-get install -y --no-install-recommends \
              protobuf-compiler libprotobuf-dev
          else
            brew install protobuf
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},${{ matrix.guest_target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build (real microVM backend, libkrun embedded)
        run: |
          cargo build --release --workspace --target ${{ matrix.target }} \
            --features ward-core/krunvm,ward-daemon/krunvm

      # macOS Hypervisor entitlement. libkrun on Apple Silicon calls
      # into the Hypervisor framework; without the
      # com.apple.security.hypervisor entitlement, `krun_start_enter`
      # returns HV_ERROR_BAD_ARGUMENT and no microVM ever boots. The
      # release artefact must carry this entitlement BEFORE the tarball
      # is staged — otherwise install.sh users on macOS get a daemon
      # that runs but can't create sandboxes.
      #
      # Ad-hoc signing (--sign -) is sufficient to apply the
      # entitlement locally on the user's machine. It does NOT satisfy
      # Gatekeeper for distribution outside that machine; that's the
      # Tier 2 work tracked by #30 (Developer ID + notarization).
      #
      # We sign both wardd and ward-mcp because both spawn libkrun via
      # ward-runtime. The ward CLI is a thin gRPC client that never
      # touches libkrun directly, so it does not need the entitlement.
      - name: Codesign macOS binaries with Hypervisor entitlement
        if: matrix.target == 'aarch64-apple-darwin'
        # The ${{ }} interpolation for matrix.target is workflow-
        # controlled (defined in the matrix block above, not user
        # input), but routing it through env: keeps the shell free
        # of expression-injection foot-guns. See
        # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN_DIR="target/${TARGET}/release"
          for bin in wardd ward-mcp; do
            codesign --sign - \
              --entitlements entitlements.plist \
              --options runtime \
              --force \
              "${BIN_DIR}/${bin}"
            # Verify the entitlement is present before staging — a
            # missing entitlement here means a silently-unusable
            # release, so we surface it immediately rather than at
            # users' first `ward create`.
            codesign -d --entitlements - "${BIN_DIR}/${bin}" \
              | grep -q "com.apple.security.hypervisor"
            # The hardened runtime also needs this one, or the unpacked
            # libkrun fails to load on first run.
            codesign -d --entitlements - "${BIN_DIR}/${bin}" \
              | grep -q "com.apple.security.cs.disable-library-validation"
            echo "OK: ${bin} signed with the Hypervisor and library entitlements"
          done

      - name: Stage archive
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="ward-${VERSION}-${TARGET}"
          mkdir -p "${STAGE}/bin"
          cp "target/${TARGET}/release/wardd" "${STAGE}/bin/"
          cp "target/${TARGET}/release/ward" "${STAGE}/bin/"
          # ward-mcp ships in every release so agents (Claude / Cursor)
          # can be wired against a stable install path. Same Hypervisor
          # entitlement applied above on macOS.
          cp "target/${TARGET}/release/ward-mcp" "${STAGE}/bin/"
          cp LICENSE THIRD-PARTY-NOTICES.md "${STAGE}/" 2>/dev/null || true
          cp README.md "${STAGE}/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          # Cross-platform SHA-256.
          if command -v sha256sum > /dev/null; then
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi
          ls -la "${STAGE}.tar.gz" "${STAGE}.tar.gz.sha256"

      # SLSA Build L3 provenance is generated by the slsa_provenance
      # job below from the per-target hashes. The L3 attestation
      # supersedes what `actions/attest-build-provenance@v3`
      # previously produced from inside this user-controlled job
      # (a Build L2 attestation): the L3 generator runs in an
      # isolated reusable-workflow context the caller workflow
      # cannot inject into.

      - name: Upload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ward-${{ matrix.target }}
          path: |
            ward-*-${{ matrix.target }}.tar.gz
            ward-*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # ── Combine per-target SHA-256 hashes into one base64 string ─────
  # The SLSA L3 reusable workflow takes a single `base64-subjects`
  # input listing every artifact hash. GitHub Actions matrix outputs
  # cannot fan back in (only the last matrix leg's outputs survive),
  # so we download each leg's `.sha256` sidecar, concatenate, and
  # base64-encode in this dedicated job. The resulting string is the
  # canonical list of subjects the L3 generator will attest to.
  combine_hashes:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.combine.outputs.hashes }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # GitHub API + artifact storage only; this job has no source
          # checkout, no toolchain install, no registry calls.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - id: combine
        run: |
          set -euo pipefail
          # Re-emit the hashes in `sha256  filename` form (the format the
          # SLSA generator accepts) by stripping any leading directory
          # path the upload-artifact path produced.
          ( cd dist && cat ./*.sha256 | awk '{print $1"  "$NF}' ) > all-hashes.txt
          echo "::group::Subject hashes attested"
          cat all-hashes.txt
          echo "::endgroup::"
          # base64 -w0 not available on macOS, but this job runs on
          # ubuntu-latest so the GNU coreutils flag works.
          echo "hashes=$(base64 -w0 all-hashes.txt)" >> "$GITHUB_OUTPUT"

  # ── SLSA Build L3 provenance via the framework's reusable workflow
  # Runs in an isolated job context the caller workflow (this file)
  # cannot inject into, which is what closes the L2 -> L3 gap. The
  # caller only contributes the artifact hashes; the build environment
  # the attestation describes is the reusable workflow's own runner,
  # not ours. End users verify with either:
  #   gh attestation verify <file> --owner igorjs
  #   slsa-verifier verify-artifact --provenance-path <intoto>
  #     --source-uri github.com/igorjs/ward <file>
  #
  # Pinned to the v2.1.0 TAG, not a SHA. The SLSA generator records
  # the tag value in the signed provenance as the builder identity
  # and rejects SHA pins at runtime (`generate-builder.sh` exits 2
  # with "Invalid ref: <sha>. Expected ref of the form refs/tags/vX.Y.Z").
  # `.github/workflow-hygiene.sh` exempts this `uses:` line for the
  # same reason. Dependabot can still bump the tag here in lockstep
  # with the rest of github-actions ecosystem updates.
  slsa_provenance:
    needs: [resolve, combine_hashes]
    # Permissions per slsa-framework/slsa-github-generator docs:
    # id-token for sigstore OIDC, contents:write to attach the
    # attestation to the release, actions:read so the generator can
    # read the calling workflow's metadata for the provenance subject.
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.combine_hashes.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.resolve.outputs.tag }}

  # ── Publish a single release with every per-target tarball ────────
  publish:
    needs: [resolve, build, slsa_provenance]
    runs-on: ubuntu-latest
    # Attaches assets to the GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry, apt + brew (for protoc). The sigstore
          # endpoints (fulcio / rekor / tuf-repo-cdn) used to live
          # here for actions/attest-build-provenance; the SLSA L3
          # generator does its own sigstore signing inside its
          # isolated reusable-workflow context, so they're no longer
          # needed in any caller-side job.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            # softprops/action-gh-release uploads release assets to
            # uploads.github.com; without this, the asset upload step
            # fails with "ECONNREFUSED" because harden-runner drops
            # the connection at the network layer.
            uploads.github.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download all artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Summarise release contents
        run: |
          {
            echo "## Release ${NEEDS_RESOLVE_OUTPUTS_TAG}"
            echo ""
            echo "**Artefacts** (paste into install.sh's CHECKSUMS table):"
            echo ""
            echo '```'
            cat dist/*.sha256 | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NEEDS_RESOLVE_OUTPUTS_TAG: ${{ needs.resolve.outputs.tag }}

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ward ${{ needs.resolve.outputs.version }}
          body: |
            Pre-built ward binaries. Install with:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/igorjs/ward/main/install.sh | bash
            ```

            Or download a tarball directly and extract:

            ```sh
            tar -xzf ward-${{ needs.resolve.outputs.version }}-<target>.tar.gz
            ./ward-${{ needs.resolve.outputs.version }}-<target>/bin/ward --help
            ```

            ## Supported targets

            | Target                          | Backend                                |
            | ------------------------------- | -------------------------------------- |
            | `aarch64-apple-darwin`          | libkrun (HVF), embedded in the binary  |
            | `x86_64-unknown-linux-gnu`      | libkrun (KVM), embedded in the binary  |
            | `aarch64-unknown-linux-gnu`     | libkrun (KVM), embedded in the binary  |
          files: |
            dist/ward-*.tar.gz
            dist/ward-*.tar.gz.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.resolve.outputs.tag, 'dev-') }}

  # ── Update the Homebrew formula for a tagged release ───────────────
  # Rewrites packaging/homebrew/ward.rb with the release version and the
  # per-target checksums, uploads it as an artefact, and pushes it to the
  # igorjs/homebrew-ward tap as Formula/ward.rb. The push is skipped
  # cleanly unless a HOMEBREW_TAP_TOKEN secret (contents:write on the tap
  # repo) is configured. Only stable vX.Y.Z tags touch the formula or the
  # tap; pre-releases and dev-* manual runs skip it.
  homebrew:
    needs: [resolve, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Classify the tag and the tap token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "stable=false" >> "${GITHUB_OUTPUT}"
            echo "${GITHUB_REF} is not a stable vX.Y.Z tag; skipping the formula update and tap push."
          fi
          echo "have_token=${HAS_TOKEN}" >> "${GITHUB_OUTPUT}"
      - name: Download checksums
        if: steps.gate.outputs.stable == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Rewrite the formula
        if: steps.gate.outputs.stable == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash scripts/update-formula.sh --require-all packaging/homebrew/ward.rb "${VERSION}" dist
      - name: Upload formula
        if: steps.gate.outputs.stable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: packaging/homebrew/ward.rb
          if-no-files-found: error
          retention-days: 14
      - name: Push formula to the tap
        if: steps.gate.outputs.stable == 'true' && steps.gate.outputs.have_token == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${TAP_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
            clone --depth 1 https://github.com/igorjs/homebrew-ward.git tap
          mkdir -p tap/Formula
          cp packaging/homebrew/ward.rb tap/Formula/ward.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Formula already at ${VERSION}; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ward.rb
          git commit -m "ward ${VERSION}"
          git -c "http.extraheader=Authorization: Basic ${auth}" push origin HEAD
      - name: Note skipped tap push
        if: steps.gate.outputs.stable == 'true' && steps.gate.outputs.have_token != 'true'
        run: echo "HOMEBREW_TAP_TOKEN is not set; formula uploaded as an artefact only."
