name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # ── Path filter: skip Rust build/test/lint on docs-only changes ────────
  # Every other job in this workflow runs `cargo` against the workspace, so
  # none of them can be affected by a change that only touches documentation
  # or an unrelated SDK (sdks/go, sdks/python, sdks/typescript aren't Cargo
  # workspace members). This job always runs and reports its diff, so the
  # downstream jobs still produce a check run (skipped, not missing) for
  # required-status-check purposes; only their own `if:` decides whether the
  # expensive work happens. Diffs the PR head against its base, or the push
  # `before` SHA, falling back to running everything when there's no usable
  # base to diff against (new branch, force-push with no prior ref).
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Rust-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No usable base SHA (got '$BASE_SHA'); running all jobs."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^vendor/|^\.github/workflows/ci\.yml$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Fast fail: formatting ────────────────────────────────────────────
  fmt:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry (sparse index + crate downloads), apt
          # (Ubuntu archives + Microsoft package signing), brew (formula
          # metadata + GHCR-hosted bottles). Tightened iteratively if
          # telemetry shows any endpoint is unused; loosened if a CI
          # job legitimately needs a missing one.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check

  # ── Lint ─────────────────────────────────────────────────────────────
  clippy:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry (sparse index + crate downloads), apt
          # (Ubuntu archives + Microsoft package signing), brew (formula
          # metadata + GHCR-hosted bottles). Tightened iteratively if
          # telemetry shows any endpoint is unused; loosened if a CI
          # job legitimately needs a missing one.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install protoc
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update \
              && sudo timeout 180 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y protobuf-compiler \
              && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Unit + integration tests ────────────────────────────────────────
  # Fast tier: ward-core unit tests (inline #[cfg(test)] modules) and
  # ward-core integration tests (tests/grpc_*.rs that spin up an in-process
  # tonic server). No subprocess management, sub-second runtime.
  test:
    needs: [changes, clippy]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry (sparse index + crate downloads), apt
          # (Ubuntu archives + Microsoft package signing), brew (formula
          # metadata + GHCR-hosted bottles). Tightened iteratively if
          # telemetry shows any endpoint is unused; loosened if a CI
          # job legitimately needs a missing one.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update \
              && sudo timeout 180 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y protobuf-compiler \
              && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install e2fsprogs (macOS)
        # mkfs.ext4 is preinstalled on Ubuntu; macOS ships nothing equivalent.
        # The volume manager shells out to mkfs.ext4 to format the disk image
        # libkrun mounts inside the microVM (ext4 regardless of host OS).
        # Homebrew installs this keg-only so the sbin path needs to land on
        # PATH explicitly via $GITHUB_PATH.
        if: runner.os == 'macOS'
        run: |
          brew install e2fsprogs
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
      - name: Build (libraries + binaries)
        run: cargo build --workspace
      - name: Smoke test (ward CLI responds to --version)
        # Catches link errors and broken clap setups that compile but
        # crash before any test runs the binary. Only `ward` (the CLI)
        # has a clap parser; `wardd` is a daemon that ignores argv and
        # binds its Unix socket on startup, so invoking it here would
        # hang the job. Daemon link-check is covered by the subsequent
        # e2e job which spawns wardd with a timeout via assert_cmd.
        run: ./target/debug/ward --version
      - name: Unit tests (all crates)
        run: cargo test --workspace --lib --bins
      - name: Integration tests (ward-core)
        run: cargo test -p ward-core --tests
      - name: Integration tests (ward-net)
        # Separate step from the two above: ward-core's --tests run
        # doesn't touch ward-net's own tests/ directory.
        run: cargo test -p ward-net --tests
      - name: Integration tests (ward-mcp)
        # Separate step: ward-mcp's tests/ (handshake, tool_calls) exercise
        # the stdio JSON-RPC server against the stub backend, no libkrun.
        run: cargo test -p ward-mcp --tests
      - name: Integration tests (ward-runtime)
        # Separate step: ward-runtime's tests/ boot the embedded runtime
        # with the default (non-krunvm) stub backend, no libkrun.
        run: cargo test -p ward-runtime --tests
      - name: Integration tests (ward-client SDK)
        # Separate step: ward-client's tests/e2e.rs spawns the wardd
        # binary (built above) and drives it over gRPC using the default
        # stub backend, no libkrun.
        run: cargo test -p ward-client --tests

  # ── E2E tests ───────────────────────────────────────────────────────
  # Slow tier: spawns the real wardd binary as a subprocess and runs the
  # compiled ward CLI against it. Validates user-facing behaviour
  # (exit codes, stdout, socket discovery) that the in-process tests cannot.
  # Runs on every PR but in its own job so failures here are visibly
  # distinct from cheaper test failures.
  e2e:
    needs: [changes, clippy]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry (sparse index + crate downloads), apt
          # (Ubuntu archives + Microsoft package signing), brew (formula
          # metadata + GHCR-hosted bottles). Tightened iteratively if
          # telemetry shows any endpoint is unused; loosened if a CI
          # job legitimately needs a missing one.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update \
              && sudo timeout 180 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y protobuf-compiler \
              && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install e2fsprogs (macOS)
        # e2e tests spin up the wardd binary which formats real ext4 images
        # via mkfs.ext4. Ubuntu ships e2fsprogs; macOS needs it from Homebrew
        # and the keg-only sbin appended to PATH for the daemon to find it.
        if: runner.os == 'macOS'
        run: |
          brew install e2fsprogs
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
      - name: Build (required so assert_cmd finds wardd and ward binaries)
        run: cargo build --workspace
      - name: E2E tests (wardd subprocess + ward CLI)
        run: cargo test -p ward-daemon --tests

  # ── libkrun feature build ────────────────────────────────────────────
  # Compiles, lints and unit-tests the workspace with the real microVM
  # backend on both supported host targets. ward-bundle downloads the pinned
  # libkrun bottle itself and verifies it against
  # vendor/libkrun-checksums.txt. macOS runners cannot boot a microVM (no
  # nested HVF); the vm-e2e job below boots real VMs on Linux with KVM.
  krunvm-build:
    needs: [changes, clippy]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            guest_target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
            guest_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry (sparse index + crate downloads), apt
          # (Ubuntu archives + Microsoft package signing), brew (formula
          # metadata + GHCR-hosted bottles). Tightened iteratively if
          # telemetry shows any endpoint is unused; loosened if a CI
          # job legitimately needs a missing one.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.guest_target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update \
              && sudo timeout 180 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y protobuf-compiler \
              && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Build (--features krunvm)
        run: cargo build --workspace --features ward-core/krunvm
      - name: Clippy (--features krunvm)
        run: cargo clippy --all-targets --features ward-core/krunvm -- -D warnings
      - name: Unit tests (--features krunvm)
        run: cargo test -p ward-core --lib --features krunvm
      - name: Compile e2e test targets (--features krunvm)
        run: RUSTFLAGS=-Dwarnings cargo test -p ward-daemon --features krunvm --test smoltcp_e2e --no-run
      - name: Bundle tests with the libraries embedded
        run: cargo test -p ward-bundle --features embed

  # ── Real microVM end-to-end ──────────────────────────────────────────
  # Boots real Linux guests through the shipped code path: wardd, the
  # embedded libkrun, a pulled OCI image and the ward CLI. Needs KVM, which
  # GitHub's Linux x64 runners expose as /dev/kvm once the udev rule below
  # makes it world-accessible.
  vm-e2e:
    needs: [changes, clippy]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install protoc
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update \
              && sudo timeout 180 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y protobuf-compiler \
              && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Build
        run: cargo build -p ward-daemon -p ward-cli --features ward-daemon/krunvm
      - name: Real-VM end-to-end tests
        env:
          WARD_E2E_VM: "1"
          # GHCR is already on the egress allowlist. Docker Hub serves layers
          # from rotating CDN hosts that cannot be pinned.
          WARD_E2E_IMAGE: ghcr.io/linuxcontainers/alpine:3.20
        run: cargo test -p ward-daemon --features krunvm --test e2e_vm --test e2e_cli_attach -- --test-threads=2
      - name: Real-VM MCP end-to-end test
        env:
          WARD_E2E_VM: "1"
          WARD_E2E_IMAGE: ghcr.io/linuxcontainers/alpine:3.20
        run: cargo test -p ward-mcp --features krunvm --test e2e_vm

  # ── MSRV (minimum supported Rust version) ───────────────────────────
  # Reads rust-version from Cargo.toml; no extra tooling needed.
  msrv:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry (sparse index + crate downloads), apt
          # (Ubuntu archives + Microsoft package signing), brew (formula
          # metadata + GHCR-hosted bottles). Tightened iteratively if
          # telemetry shows any endpoint is unused; loosened if a CI
          # job legitimately needs a missing one.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install protoc
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update \
              && sudo timeout 180 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y protobuf-compiler \
              && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Check MSRV compiles
        run: cargo check --all-targets

  # ── Wire compatibility of the public protos (ADR-004, ADR-022) ───────
  proto-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the compatibility check
        run: bash scripts/check-proto-compat.test.sh
      - name: Check protos against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-proto-compat.sh "origin/${BASE_REF}"

  # ── SDK tests (Go, Python, TypeScript) ───────────────────────────────
  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Go SDK tests
        working-directory: sdks/go
        run: go test ./...
      - name: Python SDK tests
        working-directory: sdks/python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pytest pytest-asyncio
          PYTHONPATH=. .venv/bin/python -m pytest
      - name: TypeScript SDK tests
        working-directory: sdks/typescript
        run: |
          npm install --no-save typescript @types/node
          npx tsc && node --test dist/

  # ── Supply chain audit ───────────────────────────────────────────────
  deny:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry (sparse index + crate downloads), apt
          # (Ubuntu archives + Microsoft package signing), brew (formula
          # metadata + GHCR-hosted bottles). Tightened iteratively if
          # telemetry shows any endpoint is unused; loosened if a CI
          # job legitimately needs a missing one.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check

  # ── Code coverage ───────────────────────────────────────────────────
  # Uses cargo-llvm-cov (LLVM source-based instrumentation) which is the
  # most accurate coverage tool for Rust and what the Rust project itself
  # uses. Covers unit tests + ward-core integration tests; E2E coverage
  # would require instrumenting subprocesses, deferred for now.
  #
  # Output appears on the workflow run page as a Job Summary so the
  # coverage delta is visible on every PR without an external service.
  # The lcov report is also uploaded as an artifact for offline analysis.
  coverage:
    needs: [changes, clippy]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          # Allowlist covers GitHub API + git transport, Rust toolchain
          # + cargo registry (sparse index + crate downloads), apt
          # (Ubuntu archives + Microsoft package signing), brew (formula
          # metadata + GHCR-hosted bottles). Tightened iteratively if
          # telemetry shows any endpoint is unused; loosened if a CI
          # job legitimately needs a missing one.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            security.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            formulae.brew.sh:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-llvm-cov
      - name: Install protoc
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update \
              && sudo timeout 180 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y protobuf-compiler \
              && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
      - name: Run tests with coverage instrumentation
        # --no-report runs the test suite under coverage but defers report
        # generation. This lets us emit multiple output formats (lcov for
        # artifacts, text summary for the Job Summary) from a single test
        # run, rather than recompiling and re-running for each format.
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov \
            --no-report \
            --workspace \
            --exclude ward-daemon \
            --lib \
            --tests
      - name: Generate lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Generate text summary
        # --summary-only emits a per-file + total table to stdout. We
        # capture it both as a file (for the Job Summary block below) and
        # echo it so the raw output is visible in the CI log.
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Write GitHub Job Summary
        run: |
          {
            echo "## Code Coverage"
            echo ""
            echo "Tool: \`cargo-llvm-cov\` (LLVM source-based instrumentation)"
            echo "Scope: unit + ward-core integration tests (E2E excluded)"
            echo ""
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
